services:
  # The e2e tier crosses the network to Flask, so it is subject to whatever the
  # flask service enforces — setting RATELIMIT_ENABLED on the test container
  # alone (below) only ever covered the in-process unit and integration tiers.
  # Registering a user per test tripped the shared cap partway through a run and
  # read as flakiness. Limiting has its own coverage in test_rate_limit.py,
  # which enables it deliberately rather than depending on the ambient service.
  flask:
    environment:
      RATELIMIT_ENABLED: "false"

  # The Next.js route handlers and their server-side helpers. Nothing here talks
  # to Flask or MySQL — fetch is mocked — so it has no depends_on and no network,
  # and can run before the stack is up.
  nextjs-test:
    build:
      context: ./next-version
      target: test
    # Behind a profile so `up` leaves it alone. It is a one-shot command, and
    # the main run uses --abort-on-container-exit: a container that finishes
    # immediately would tear the whole stack down before pytest had started.
    profiles: ["frontend-tests"]

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      mysql:
        condition: service_healthy
      flask:
        condition: service_healthy
      nextjs:
        condition: service_started
    networks:
      - backend
      - frontend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TOKEN_DURATION_HOURS=48
      - FLASK_URL=http://flask:3000
      - NEXTJS_URL=http://nextjs:5000
      - RUN_INTEGRATION_TESTS=true
      - RUN_E2E_TESTS=true
      - RATELIMIT_ENABLED=false
      # pytest imports app.py in this container, which would start the daily
      # sweep in a background thread and let it write underneath a test's
      # fixtures. The flask service keeps its scheduler on, so the e2e tier
      # still exercises the real boot path.
      - SCHEDULER_ENABLED=false

networks:
  backend:
  frontend:

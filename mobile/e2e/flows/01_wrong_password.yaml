# A wrong password pairs nothing and says why, without leaving the pair screen.
appId: dev.mpreto.namu.lan
---
- launchApp:
    clearState: true
- assertVisible: "Pair this phone"
- runFlow:
    file: _fill_pairing_form.yaml
    env:
      PASSWORD: "not-the-password"
- assertVisible:
    id: "pair-error"
    text: "Invalid username or password"
- assertVisible: "Pair this phone"
- takeScreenshot: 01_wrong_password
